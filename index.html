<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alemitu Coffee</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="nav-bar section-content">
            <a href="#" class="nv-logo">
                <h1 class="nav-text"><img src="images/Alemiti Coffee Emblem cup only.png" alt="logo">Alemitu</h1>
            </a>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">About</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Menu</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Testimonials</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Gallery</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Contact</a>
                </li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section class="hero-section">
            <div class="section-content">
                <div class="hero-details">
                    <h2 class="title">Best Coffee</h2>
                    <h3 class="subtitle">Make your day great with our special
                        coffee!</h3>
                        <p class="description">Welcome to our coffee paradise, where
                        every bean tells a story and every cup sparks joy.</p>
                        <div class="buttons">
                            <a href="#" class="button order-now">Order Now</a>
                            <a href="#" class="button contact-us">Contact Us</a>
                        </div>
                </div>
                <div class="hero-image-wrapper">
                    <img src="images/hero.png" alt="Hero" class="hero-image">
                </div>
            </div>
        </section>
    </main>
</body>
</html>
